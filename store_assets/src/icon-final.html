<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&display=swap" rel="stylesheet">
<style>body { margin: 0; background: transparent; } #icon { width: 512px; height: 512px; }</style>
</head>
<body>
<div id="icon"></div>
<script>
// Final design: "C4 royal deep" — Amiri 700 baa (ب), royal blue gradient,
// gold fatha above. Rendered at 512 and downscaled.
// NOTE: the shipped alif_*.png icons were generated by a separate process;
// treat this as a design reference and reconcile against the shipped PNGs
// if the icons are ever regenerated.
const s = 512;
const r = 27 * s / 128;
const fw = s * 0.20, fh = s * 0.055;   // fatha bar (diagonal, above the letter)
const fy = s * 0.20;
document.getElementById('icon').innerHTML = `
<svg width="${s}" height="${s}" viewBox="0 0 ${s} ${s}" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#172554"/><stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#fff" stop-opacity="0.14"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="${s}" height="${s}" rx="${r}" fill="url(#bg)"/>
  <circle cx="${s/2}" cy="${s*0.45}" r="${s*0.52}" fill="url(#glow)"/>
  <text x="${s/2}" y="${s*0.70}" text-anchor="middle" font-family="Amiri"
        font-weight="700" font-size="${s*0.72}" fill="#ffffff">ب</text>
  <rect x="${s/2 - fw/2}" y="${fy}" width="${fw}" height="${fh}" rx="${fh/2}" fill="#facc15"
        transform="rotate(-20 ${s/2} ${fy + fh/2})"/>
</svg>`;
</script>
</body>
</html>
